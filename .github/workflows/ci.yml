name: build
on: [push, pull_request]
jobs:
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pixelmap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/pixelmap_test?sslmode=disable
      NOTIFICATIONS_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/pixelmap_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetch at least 2 commits for Codecov to generate proper diff

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false

      # Get pnpm store directory
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # Setup pnpm cache
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Setup Go for backend tests
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      # Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run tests with coverage
      - name: Typecheck and lint frontend
        run: pnpm --dir frontend typecheck && pnpm --dir frontend lint

      - name: Run tests with coverage
        run: pnpm run test:coverage:combined

      - name: Check Go and concurrent notification delivery
        run: cd backend && go vet ./... && go test -race ./internal/notifications

      - name: Build static website
        run: pnpm --dir frontend build

      # Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/frontend-lcov.info,./coverage/backend-coverage.out
          flags: unittests
          name: pixelmap-coverage
          fail_ci_if_error: false
          verbose: true
