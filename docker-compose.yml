# Local development stack. No writes to production S3 or Discord.
name: pixelmap-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pixelmap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:${PIXELMAP_DB_PORT:-15433}:5432"
    volumes:
      - local_postgres:/var/lib/postgresql/data
      - ./backend/internal/db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  indexer:
    build:
      context: ./backend
      dockerfile: Dockerfile.raccoon
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:local-only@postgres:5432/pixelmap?sslmode=disable
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      WEB3_URL: ${WEB3_URL:-}
      SYNC_TO_AWS: "false"
    volumes:
      - local_cache:/app/cache
  assets:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${PIXELMAP_ASSET_PORT:-3001}:80"
    volumes:
      - local_cache:/usr/share/nginx/html:ro
      - ./scripts/local-assets.conf:/etc/nginx/conf.d/default.conf:ro
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_ASSET_BASE_URL: http://localhost:${PIXELMAP_ASSET_PORT:-3001}
    ports:
      - "127.0.0.1:${PIXELMAP_WEB_PORT:-3000}:80"
volumes:
  local_postgres:
  local_cache:
